<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vansh Nutrition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;background:#0f1117;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
body{display:flex;flex-direction:column;}

/* HEADER */
.hdr{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-title{font-size:20px;font-weight:700;color:#e6edf3;letter-spacing:-.02em;}
.hdr-title span{color:#3fb950;}
.date{font-size:13px;color:#484f58;}

/* GRID */
.grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,1fr);
  gap:10px;
  padding:0 12px 12px;
  overflow:hidden;
}
.card{
  background:#161b22;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  padding:10px;
  position:relative;
  overflow:hidden;
  transition:opacity .15s;
}
.card:active{opacity:.65;}
.progress-bar{
  position:absolute;
  bottom:0;left:0;right:0;
  height:4px;
  background:rgba(255,255,255,.06);
}
.progress-fill{
  height:100%;
  border-radius:0 2px 2px 0;
  transition:width .4s cubic-bezier(.16,1,.3,1);
}
.card-icon{font-size:26px;line-height:1;}
.card-name{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;}
.card-val{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.card-tgt{font-size:12px;color:#484f58;font-variant-numeric:tabular-nums;}
.card-pct{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:2px;}

/* SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{
  background:#161b22;
  border-radius:24px 24px 0 0;
  border-top:1px solid rgba(255,255,255,.08);
  width:100%;max-width:500px;
  padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));
  max-height:80dvh;overflow-y:auto;
}
.handle{width:40px;height:4px;background:#21262d;border-radius:99px;margin:14px auto 20px;}
.sheet-name{font-size:22px;font-weight:700;color:#e6edf3;margin-bottom:4px;text-align:center;}
.sheet-tgt{font-size:14px;color:#8b949e;text-align:center;margin-bottom:22px;}
.big-inp{
  width:100%;background:#1c2128;border:2px solid rgba(255,255,255,.08);
  border-radius:14px;padding:18px;font-size:40px;font-weight:800;
  color:#e6edf3;text-align:center;font-variant-numeric:tabular-nums;
  -webkit-appearance:none;margin-bottom:14px;transition:border-color .15s;
}
.big-inp:focus{border-color:#3fb950;outline:none;}
.quick{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;}
.qb{
  background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:99px;
  padding:10px 18px;font-size:14px;color:#8b949e;min-height:44px;
  transition:all .15s;
}
.qb:active{background:#21262d;color:#e6edf3;}
.save{
  width:100%;background:#3fb950;border-radius:14px;
  padding:18px;font-size:18px;font-weight:700;color:#fff;
  min-height:56px;transition:background .15s;
  -webkit-appearance:none;
}
.save:active{background:#2ea043;}
.cancel{width:100%;padding:14px;font-size:16px;color:#484f58;min-height:48px;}

/* RESET */
.reset-row{padding:8px 12px 12px;flex-shrink:0;}
.reset{
  width:100%;background:transparent;border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:14px;font-size:14px;font-weight:600;
  color:#484f58;min-height:48px;transition:all .15s;
}
.reset:active{background:#161b22;color:#f85149;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">Vansh <span>Nutrition</span></div>
  <div class="date" id="dateEl"></div>
</div>

<div class="grid" id="grid"></div>

<div class="reset-row">
  <button class="reset" onclick="resetAll()">Reset Day</button>
</div>

<!-- SHEET -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-name" id="sName"></div>
    <div class="sheet-tgt" id="sTgt"></div>
    <input class="big-inp" type="number" id="sInput" inputmode="decimal" placeholder="0">
    <div class="quick" id="sQuick"></div>
    <button class="save" onclick="save()">Save</button>
    <button class="cancel" onclick="close_()">Cancel</button>
  </div>
</div>

<script>
var DATA = [
  {id:'cal',  name:'Calories', icon:'🔥', tgt:2929, unit:'kcal', color:'#f0883e', quick:[500,1000,1500,2000,2929]},
  {id:'prot', name:'Protein',  icon:'💪', tgt:190,  unit:'g',    color:'#58a6ff', quick:[30,60,100,150,190]},
  {id:'carb', name:'Carbs',    icon:'🌾', tgt:310,  unit:'g',    color:'#d29922', quick:[50,100,150,200,310]},
  {id:'fat',  name:'Fat',      icon:'🥑', tgt:95,   unit:'g',    color:'#bc8cff', quick:[20,40,60,80,95]},
  {id:'fib',  name:'Fiber',    icon:'🥦', tgt:45,   unit:'g',    color:'#39c5cf', quick:[10,20,30,45]},
  {id:'wat',  name:'Water',    icon:'💧', tgt:3.5,  unit:'L',    color:'#58a6ff', quick:[0.5,1,2,3,3.5]},
];

var vals = {};
var cur = null;

function pct(id){
  var d = DATA.find(function(x){return x.id===id;});
  var v = parseFloat(vals[id])||0;
  return Math.min(Math.round(v/d.tgt*100), 100);
}

function render(){
  var g = document.getElementById('grid');
  g.innerHTML = '';
  DATA.forEach(function(d){
    var v = parseFloat(vals[d.id])||0;
    var p = pct(d.id);
    var pctCls = p>=100 ? 'background:rgba(63,185,80,.15);color:#3fb950' : p>0 ? 'background:rgba(240,136,62,.12);color:'+d.color : 'background:#21262d;color:#484f58';
    var card = document.createElement('div');
    card.className = 'card';
    card.onclick = function(){openSheet(d.id);};
    card.innerHTML =
      '<div class="progress-bar"><div class="progress-fill" style="width:'+p+'%;background:'+d.color+'"></div></div>'+
      '<div class="card-icon">'+d.icon+'</div>'+
      '<div class="card-name">'+d.name+'</div>'+
      '<div class="card-val" style="color:'+d.color+'">'+formatVal(v, d.unit)+'</div>'+
      '<div class="card-tgt">/ '+d.tgt+' '+d.unit+'</div>'+
      '<div class="card-pct" style="'+pctCls+'">'+p+'%</div>';
    g.appendChild(card);
  });
}

function formatVal(v, unit){
  if(unit === 'L') return (Math.round(v*10)/10).toFixed(1);
  if(unit === 'kcal') return Math.round(v).toLocaleString();
  return Math.round(v*10)/10;
}

function openSheet(id){
  cur = id;
  var d = DATA.find(function(x){return x.id===id;});
  document.getElementById('sName').textContent = d.icon+' '+d.name;
  document.getElementById('sTgt').textContent = 'Target: '+d.tgt+' '+d.unit;
  document.getElementById('sInput').value = vals[id]||'';
  var qEl = document.getElementById('sQuick');
  qEl.innerHTML = '';
  d.quick.forEach(function(q){
    var b = document.createElement('button');
    b.className = 'qb';
    b.textContent = q+' '+d.unit;
    b.onclick = function(){document.getElementById('sInput').value = q;};
    qEl.appendChild(b);
  });
  document.getElementById('overlay').classList.add('open');
  setTimeout(function(){document.getElementById('sInput').focus();}, 200);
}

function save(){
  if(!cur) return;
  var v = parseFloat(document.getElementById('sInput').value)||0;
  vals[cur] = v;
  close_();
  render();
}

function closeOverlay(e){if(e.target===document.getElementById('overlay'))close_();}
function close_(){document.getElementById('overlay').classList.remove('open');cur=null;}

function resetAll(){
  if(!confirm('Reset all values?')) return;
  vals = {};
  render();
}

var d = new Date();
var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('dateEl').textContent = days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];

render();
</script>
</body>
</html>
