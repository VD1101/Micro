<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vansh Nutrition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;background:#0f1117;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
body{display:flex;flex-direction:column;}
.hdr{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-title{font-size:20px;font-weight:700;color:#e6edf3;letter-spacing:-.02em;}
.hdr-title span{color:#3fb950;}
.date{font-size:13px;color:#484f58;}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:10px;padding:0 12px 12px;overflow:hidden;}
.card{background:#161b22;border:1px solid rgba(255,255,255,.07);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:10px;position:relative;overflow:hidden;transition:opacity .15s;}
.card:active{opacity:.65;}
.progress-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.06);}
.progress-fill{height:100%;border-radius:0 2px 2px 0;transition:width .4s cubic-bezier(.16,1,.3,1);}
.card-icon{font-size:26px;line-height:1;}
.card-name{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;}
.card-val{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.card-tgt{font-size:12px;color:#484f58;font-variant-numeric:tabular-nums;}
.card-pct{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:2px;}

/* OVERLAY & SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:#161b22;border-radius:24px 24px 0 0;border-top:1px solid rgba(255,255,255,.08);width:100%;max-width:500px;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;}
.handle{width:40px;height:4px;background:#21262d;border-radius:99px;margin:14px auto 14px;}
.sheet-name{font-size:19px;font-weight:700;color:#e6edf3;text-align:center;margin-bottom:2px;}
.sheet-tgt{font-size:13px;color:#484f58;text-align:center;margin-bottom:16px;}

/* TOTAL ROW */
.total-row{background:#0d1117;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.total-label{font-size:12px;font-weight:600;color:#484f58;text-transform:uppercase;letter-spacing:.05em;}
.total-val{font-size:30px;font-weight:800;color:#e6edf3;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.total-unit{font-size:13px;color:#484f58;font-weight:600;}

/* INPUT ROW - the new amount to add */
.add-label{font-size:11px;font-weight:600;color:#484f58;text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:8px;}
.add-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.add-display{
  flex:1;background:#1c2128;border:2px solid rgba(255,255,255,.08);border-radius:14px;
  padding:14px 12px;font-size:36px;font-weight:800;color:#e6edf3;
  text-align:center;font-variant-numeric:tabular-nums;min-height:66px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s;
}
.add-display.has-val{border-color:#3fb950;color:#3fb950;}

/* NUMBER PAD */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.np-btn{
  background:#1c2128;border:1px solid rgba(255,255,255,.07);border-radius:12px;
  font-size:22px;font-weight:700;color:#e6edf3;min-height:58px;
  display:flex;align-items:center;justify-content:center;
  transition:all .1s;position:relative;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
.np-btn:active{background:#21262d;transform:scale(.94);}
.np-btn.np-zero{grid-column:span 2;}
.np-btn.np-del{color:#8b949e;font-size:20px;}
.np-btn.np-dot{color:#8b949e;}

/* QUICK ADD BUTTONS */
.quick-label{font-size:11px;font-weight:600;color:#484f58;text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:8px;}
.quick{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap;}
.qb{
  background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:99px;
  padding:10px 16px;font-size:14px;font-weight:700;color:#8b949e;min-height:44px;
  transition:all .12s;
}
.qb:active{background:#21262d;color:#e6edf3;}

/* ADD BUTTON */
.add-btn{
  width:100%;background:#3fb950;border-radius:14px;
  padding:17px;font-size:18px;font-weight:700;color:#fff;
  min-height:56px;transition:background .15s;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-btn:active{background:#2ea043;}
.add-btn.disabled{background:#21262d;color:#484f58;}

/* UNDO / CLEAR ROW */
.bottom-row{display:flex;gap:8px;margin-bottom:4px;}
.btn-undo{background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;font-size:14px;font-weight:700;color:#8b949e;flex:1;min-height:48px;transition:all .15s;}
.btn-undo:active{background:#21262d;color:#e6edf3;}
.btn-zero{background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;font-size:14px;font-weight:700;color:#f85149;flex:1;min-height:48px;transition:all .15s;}
.btn-zero:active{background:#21262d;}
.cancel{width:100%;padding:12px;font-size:15px;color:#484f58;min-height:44px;}

/* RESET */
.reset-row{padding:4px 12px calc(16px + env(safe-area-inset-bottom,0px));flex-shrink:0;}
.reset{width:100%;background:transparent;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;font-size:14px;font-weight:600;color:#484f58;min-height:48px;transition:all .15s;}
.reset:active{background:#161b22;color:#f85149;}

/* Ripple */
@keyframes ripple{0%{transform:scale(0);opacity:.4}100%{transform:scale(3);opacity:0}}
.ripple-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:ripple .35s ease-out forwards;pointer-events:none;}
@keyframes popIn{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:popIn .2s ease-out;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">Vansh <span>Nutrition</span></div>
  <div class="date" id="dateEl"></div>
</div>
<div class="grid" id="grid"></div>
<div class="reset-row">
  <button class="reset" onclick="resetAll()">Reset Day</button>
</div>

<!-- SHEET -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-name" id="sName"></div>
    <div class="sheet-tgt" id="sTgt"></div>

    <!-- Running total -->
    <div class="total-row">
      <div>
        <div class="total-label">Total today</div>
        <div class="total-val" id="totalVal">0</div>
      </div>
      <div class="total-unit" id="totalUnit"></div>
    </div>

    <!-- Amount to add -->
    <div class="add-label">Amount to add</div>
    <div class="add-row">
      <div class="add-display" id="addDisplay">0</div>
    </div>

    <!-- Number pad -->
    <div class="numpad" id="numpad">
      <button class="np-btn" onclick="npPress('1')">1</button>
      <button class="np-btn" onclick="npPress('2')">2</button>
      <button class="np-btn" onclick="npPress('3')">3</button>
      <button class="np-btn" onclick="npPress('4')">4</button>
      <button class="np-btn" onclick="npPress('5')">5</button>
      <button class="np-btn" onclick="npPress('6')">6</button>
      <button class="np-btn" onclick="npPress('7')">7</button>
      <button class="np-btn" onclick="npPress('8')">8</button>
      <button class="np-btn" onclick="npPress('9')">9</button>
      <button class="np-btn np-dot" onclick="npPress('.')">·</button>
      <button class="np-btn np-zero" onclick="npPress('0')">0</button>
      <button class="np-btn np-del" onclick="npDel()">⌫</button>
    </div>

    <!-- Quick add shortcuts -->
    <div class="quick-label">Quick add</div>
    <div class="quick" id="sQuick"></div>

    <!-- ADD button -->
    <button class="add-btn" id="addBtn" onclick="addAmount()">
      <span id="addBtnLabel">+ Add</span>
    </button>

    <!-- Undo / Zero -->
    <div class="bottom-row">
      <button class="btn-undo" onclick="undoLast()" id="undoBtn">↩ Undo last</button>
      <button class="btn-zero" onclick="zeroTotal()">✕ Reset to 0</button>
    </div>
    <button class="cancel" onclick="close_()">Close</button>
  </div>
</div>

<script>
var DATA=[
  {id:'cal', name:'Calories',icon:'🔥',tgt:2929,unit:'kcal',color:'#f0883e',quick:[50,100,200,500,1000]},
  {id:'prot',name:'Protein', icon:'💪',tgt:190, unit:'g',   color:'#58a6ff',quick:[5,10,20,30,50]},
  {id:'carb',name:'Carbs',   icon:'🌾',tgt:310, unit:'g',   color:'#d29922',quick:[10,25,50,75,100]},
  {id:'fat', name:'Fat',     icon:'🥑',tgt:95,  unit:'g',   color:'#bc8cff',quick:[5,10,15,20,30]},
  {id:'fib', name:'Fiber',   icon:'🥦',tgt:45,  unit:'g',   color:'#39c5cf',quick:[2,5,10,15,20]},
  {id:'wat', name:'Water',   icon:'💧',tgt:3.5, unit:'L',   color:'#58a6ff',quick:[0.25,0.5,0.75,1,1.5]},
];

var vals={};       // running total per nutrient
var history={};    // last added value per nutrient (for undo)
var cur=null;
var inputStr='0';  // what user is typing in numpad

function pct(id){
  var d=DATA.find(function(x){return x.id===id;});
  return Math.min(Math.round((parseFloat(vals[id])||0)/d.tgt*100),100);
}
function formatVal(v,unit){
  if(unit==='L')return (Math.round(v*100)/100).toFixed(1);
  if(unit==='kcal')return Math.round(v).toLocaleString();
  return +(Math.round(v*100)/100);
}
function round(v){return Math.round(v*1000)/1000;}

function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  DATA.forEach(function(d){
    var v=parseFloat(vals[d.id])||0,p=pct(d.id);
    var pctCls=p>=100?'background:rgba(63,185,80,.15);color:#3fb950':p>0?'background:rgba(240,136,62,.12);color:'+d.color:'background:#21262d;color:#484f58';
    var card=document.createElement('div');card.className='card';
    card.onclick=function(){openSheet(d.id);};
    card.innerHTML=
      '<div class="progress-bar"><div class="progress-fill" style="width:'+p+'%;background:'+d.color+'"></div></div>'+
      '<div class="card-icon">'+d.icon+'</div>'+
      '<div class="card-name">'+d.name+'</div>'+
      '<div class="card-val" style="color:'+d.color+'">'+formatVal(v,d.unit)+'</div>'+
      '<div class="card-tgt">/ '+d.tgt+' '+d.unit+'</div>'+
      '<div class="card-pct" style="'+pctCls+'">'+p+'%</div>';
    g.appendChild(card);
  });
}

/* ---- numpad logic ---- */
function npPress(ch){
  if(ch==='.' && inputStr.indexOf('.')!==-1) return; // only one dot
  if(inputStr==='0' && ch!=='.') inputStr=ch;
  else inputStr+=ch;
  // limit length
  if(inputStr.length>8) return;
  updateAddDisplay();
}
function npDel(){
  if(inputStr.length<=1){inputStr='0';}
  else{inputStr=inputStr.slice(0,-1);}
  updateAddDisplay();
}
function setInput(v){
  inputStr=String(v);
  updateAddDisplay();
}

function updateAddDisplay(){
  var d=document.getElementById('addDisplay');
  var v=parseFloat(inputStr)||0;
  d.textContent=inputStr==='0'?'0':inputStr;
  if(v>0){d.classList.add('has-val');}else{d.classList.remove('has-val');}
  // update add button label
  var btn=document.getElementById('addBtnLabel');
  if(v>0 && cur){
    var dn=DATA.find(function(x){return x.id===cur;});
    var newTotal=round((parseFloat(vals[cur])||0)+v);
    btn.textContent='+ Add '+v+' '+dn.unit+' → '+formatVal(newTotal,dn.unit);
    document.getElementById('addBtn').classList.remove('disabled');
  } else {
    btn.textContent='+ Add';
    document.getElementById('addBtn').classList.add('disabled');
  }
}

function addAmount(){
  var v=parseFloat(inputStr)||0;
  if(v<=0||!cur) return;
  history[cur]=v;                              // save for undo
  vals[cur]=round((parseFloat(vals[cur])||0)+v);
  // pop animation on total
  var tv=document.getElementById('totalVal');
  tv.classList.remove('pop');void tv.offsetWidth;tv.classList.add('pop');
  tv.textContent=formatVal(vals[cur], DATA.find(function(x){return x.id===cur;}).unit);
  // reset input
  inputStr='0';
  updateAddDisplay();
  render();
}

function undoLast(){
  if(!cur||!history[cur]) return;
  var prev=history[cur];
  vals[cur]=round(Math.max(0,(parseFloat(vals[cur])||0)-prev));
  history[cur]=null;
  var tv=document.getElementById('totalVal');
  tv.textContent=formatVal(vals[cur], DATA.find(function(x){return x.id===cur;}).unit);
  render();
}

function zeroTotal(){
  if(!cur) return;
  vals[cur]=0;history[cur]=null;
  document.getElementById('totalVal').textContent='0';
  render();
}

function openSheet(id){
  cur=id;inputStr='0';
  var d=DATA.find(function(x){return x.id===id;});
  document.getElementById('sName').textContent=d.icon+' '+d.name;
  document.getElementById('sTgt').textContent='Target: '+d.tgt+' '+d.unit;
  document.getElementById('totalUnit').textContent=d.unit;
  document.getElementById('totalVal').textContent=formatVal(parseFloat(vals[id])||0, d.unit);
  // quick buttons
  var qEl=document.getElementById('sQuick');qEl.innerHTML='';
  d.quick.forEach(function(q){
    var b=document.createElement('button');b.className='qb';
    b.textContent='+'+q+' '+d.unit;
    b.onclick=function(){setInput(q);};
    qEl.appendChild(b);
  });
  updateAddDisplay();
  document.getElementById('overlay').classList.add('open');
}

function closeOverlay(e){if(e.target===document.getElementById('overlay'))close_();}
function close_(){document.getElementById('overlay').classList.remove('open');cur=null;}
function resetAll(){if(!confirm('Reset all values for today?'))return;vals={};history={};render();}

var d=new Date(),days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('dateEl').textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];
render();
</script>
</body>
</html>
